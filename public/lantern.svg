<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 提把 / 掛繩 -->
  <path d="M 32 3 L 32 10" stroke="#f1c40f" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="3" r="2.5" fill="#f39c12"/>

  <!-- 燈籠頂蓋 (金黃色) -->
  <rect x="23" y="10" width="18" height="5" rx="2" fill="#d35400"/>
  <rect x="24" y="11" width="16" height="3" rx="1" fill="#f39c12"/>

  <!-- 燈籠本體 (圓潤飽滿紅色燈籠) -->
  <ellipse cx="32" cy="32" rx="22" ry="19" fill="#e74c3c"/>

  <!-- 燈籠縱向弧線條紋 (宮廟傳統燈籠立體骨架) -->
  <path d="M 32 13 C 24 18 20 25 20 32 C 20 39 24 46 32 51" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <path d="M 32 13 C 40 18 44 25 44 32 C 44 39 40 46 32 51" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <line x1="32" y1="13" x2="32" y2="51" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 燈籠中央金色吉祥光澤飾紋 -->
  <circle cx="32" cy="32" r="7.5" fill="#f1c40f" opacity="0.85"/>
  <circle cx="32" cy="32" r="5" fill="#e74c3c"/>
  <circle cx="32" cy="32" r="2.5" fill="#f39c12"/>

  <!-- 燈籠底座 (金黃色) -->
  <rect x="23" y="49" width="18" height="5" rx="2" fill="#d35400"/>
  <rect x="24" y="50" width="16" height="3" rx="1" fill="#f39c12"/>

  <!-- 底部流蘇 / 穗 (紅色與金黃色垂飾) -->
  <line x1="32" y1="54" x2="32" y2="59" stroke="#d35400" stroke-width="3"/>
  <circle cx="32" cy="58" r="2.5" fill="#f39c12"/>
  <path d="M 28 60 L 32 58 L 36 60 L 35 63 L 32 62 L 29 63 Z" fill="#e74c3c"/>
  <line x1="30" y1="62" x2="30" y2="64" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="32" y1="62" x2="32" y2="64" stroke="#f1c40f" stroke-width="1.5"/>
  <line x1="34" y1="62" x2="34" y2="64" stroke="#c0392b" stroke-width="1.5"/>
</svg>
